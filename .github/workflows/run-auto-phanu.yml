name: ▶️ Run

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Nilai loop awal'
        required: false
        default: '9999'
      branch:
        description: 'Branch target'
        required: false
        default: 'main'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto Phanu workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOOP="${{ github.event.inputs.loop_count }}"
          BRANCH="${{ github.event.inputs.branch }}"
          REPO="${{ github.repository }}"

          echo "🚀 Memicu auto-phanu.yml (loop_count=$LOOP, ref=$BRANCH)"
          gh workflow run auto-phanu.yml \
            --repo "$REPO" \
            --ref "$BRANCH" \
            -f "loop_count=$LOOP"

          echo "✅ Selesai. Cek di tab Actions."
