name: 🔄 Bluebob

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Base cycle'
        required: false
        default: '0'
  workflow_call:
    inputs:
      cycle:
        required: false
        type: number
        default: 0

permissions:
  actions: write

jobs:
  # =============================================
  # Hitung cycle untuk tiga xharape + restart
  # =============================================
  compute:
    runs-on: ubuntu-latest
    outputs:
      c1: ${{ steps.calc.outputs.c1 }}
      c2: ${{ steps.calc.outputs.c2 }}
      c3: ${{ steps.calc.outputs.c3 }}
      next: ${{ steps.calc.outputs.next }}
    steps:
      - id: calc
        run: |
          if [ -n "${{ inputs.cycle }}" ]; then
            BASE="${{ inputs.cycle }}"
          elif [ -n "${{ github.event.inputs.cycle }}" ]; then
            BASE="${{ github.event.inputs.cycle }}"
          else
            BASE=0
          fi
          echo "Base cycle: $BASE"
          echo "c1=$((BASE + 1))" >> $GITHUB_OUTPUT
          echo "c2=$((BASE + 2))" >> $GITHUB_OUTPUT
          echo "c3=$((BASE + 3))" >> $GITHUB_OUTPUT
          echo "next=$((BASE + 3))" >> $GITHUB_OUTPUT

  # =============================================
  # FASE-FASE UTAMA
  # =============================================
  starter:
    needs: compute
    uses: ./.github/workflows/starter.yml

  pancung-1:
    needs: starter
    uses: ./.github/workflows/pancung.yml

  khucluke-1:
    needs: pancung-1
    uses: ./.github/workflows/khucluke.yml

  pancung-2:
    needs: khucluke-1
    uses: ./.github/workflows/pancung.yml

  xharape-1:
    needs: [pancung-2, compute]
    uses: ./.github/workflows/xharape.yml
    with:
      cycle: ${{ needs.compute.outputs.c1 }}

  pancung-3:
    needs: xharape-1
    uses: ./.github/workflows/pancung.yml

  khucluke-2:
    needs: pancung-3
    uses: ./.github/workflows/khucluke.yml

  pancung-4:
    needs: khucluke-2
    uses: ./.github/workflows/pancung.yml

  xharape-2:
    needs: [pancung-4, compute]
    uses: ./.github/workflows/xharape.yml
    with:
      cycle: ${{ needs.compute.outputs.c2 }}

  pancung-5:
    needs: xharape-2
    uses: ./.github/workflows/pancung.yml

  khucluke-3:
    needs: pancung-5
    uses: ./.github/workflows/khucluke.yml

  pancung-6:
    needs: khucluke-3
    uses: ./.github/workflows/pancung.yml

  xharape-3:
    needs: [pancung-6, compute]
    uses: ./.github/workflows/xharape.yml
    with:
      cycle: ${{ needs.compute.outputs.c3 }}

  # =============================================
  # 🔁 PANGGIL RESTART DENGAN CYCLE BERIKUTNYA
  # =============================================
  panggil-restart:
    needs: [xharape-3, compute]
    uses: ./.github/workflows/restart.yml
    with:
      cycle: ${{ needs.compute.outputs.next }}
