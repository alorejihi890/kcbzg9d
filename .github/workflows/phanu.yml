name: 🟢 phanu

on:
  workflow_dispatch:
    inputs:
      loop_count:
        description: 'Siklus tersisa'
        required: true
        default: '9999'
      next_phase:
        description: 'Workflow selanjutnya (khirap atau khurap)'
        required: true
        default: 'khirap'

permissions:
  actions: write

jobs:
  run-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "hello world" & sleep 30

  line-next:
    needs: run-hello
    runs-on: ubuntu-latest
    if: github.event.inputs.loop_count > 0
    steps:
      - name: Panggil workflow selanjutnya (${{ github.event.inputs.next_phase }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_loop=$(( ${{ github.event.inputs.loop_count }} - 1 ))
          NEXT="${{ github.event.inputs.next_phase }}"
          echo "🚀 Memanggil ${NEXT}.yml dengan loop_count=$new_loop"
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${NEXT}.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"loop_count\":\"$new_loop\"}}"
